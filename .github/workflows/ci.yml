name: Validate preview
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.30.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --dir ui install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - run: pnpm test
      - run: pnpm --dir ui typecheck
      - run: pnpm package
      - name: Check out the compatible Core for host-component tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TabularisDB/tabularis
          ref: 56f79885ba7c22864345b4ec84f3c0cf4386be77
          path: .core-host
          persist-credentials: false
      - run: pnpm --dir .core-host install --frozen-lockfile --ignore-scripts
      - run: pnpm --dir .core-host build:explain
      - run: pnpm --dir .core-host build:plugin-api
      - name: Test against the separate Core checkout
        run: TABULARIS_CORE_ROOT="$GITHUB_WORKSPACE/.core-host" pnpm --dir ui test:host
