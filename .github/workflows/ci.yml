name: Validate and package Neon
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: neon-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  native:
    name: Package (${{ matrix.platform }}-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - runner: macos-15-intel
            platform: darwin
            arch: x64
          - runner: macos-15
            platform: darwin
            arch: arm64
          - runner: windows-2025
            platform: win32
            arch: x64
          - runner: windows-11-arm
            platform: win32
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.30.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          architecture: ${{ matrix.arch }}
      - name: Assert native target
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: node -e "const a = require('node:assert/strict'); a.equal(process.platform, process.env.EXPECTED_PLATFORM); a.equal(process.arch, process.env.EXPECTED_ARCH)"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --dir ui install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - run: pnpm test
      - run: pnpm --dir ui typecheck
      - run: pnpm package
      - run: pnpm test:package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: neon-${{ matrix.platform }}-${{ matrix.arch }}
          path: neon-*.zip
          if-no-files-found: error
  linux:
    runs-on: ubuntu-latest
    env:
      SQL_PAGINATION_TEST_URL: postgresql://postgres:neon-test@127.0.0.1:5432/neon_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: neon-test
          POSTGRES_DB: neon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.30.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --dir ui install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - run: pnpm test
      - run: pnpm --dir ui typecheck
      - run: pnpm package
      - name: Check out the compatible sandbox Core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TabularisDB/tabularis
          ref: a4b2b981909b756dc337f2b6cbccf6207b05fb4f
          path: .core-host
          persist-credentials: false
      - run: pnpm --dir .core-host install --frozen-lockfile --ignore-scripts
      - run: pnpm --dir .core-host build:explain
      - run: pnpm --dir .core-host build:plugin-api
      - name: Test against the separate Core checkout
        run: TABULARIS_CORE_ROOT="$GITHUB_WORKSPACE/.core-host" pnpm --dir ui test:host
      - name: Build the real sandbox host
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev
          rustup toolchain install stable --profile minimal
          pnpm --dir .core-host build:plugin-guest
          pnpm --dir .core-host build
          cargo +stable build --locked --no-default-features --manifest-path .core-host/src-tauri/Cargo.toml
      - name: Test the real Neon bundle inside the sandbox
        run: |
          pnpm --dir .core-host exec playwright install --with-deps chromium
          TABULARIS_CORE_ROOT="$GITHUB_WORKSPACE/.core-host" pnpm test:sandbox
  release:
    name: Publish plugin release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [native, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Require a merged commit
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: neon-*
          merge-multiple: true
          path: release-assets
      - name: Validate release assets and write checksums
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFile, readdir, writeFile, copyFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const manifest = JSON.parse(await readFile('.tabularium', 'utf8'));
          assert.equal(process.env.GITHUB_REF_NAME, `v${manifest.version}`);
          const platforms = ['linux-x64', 'linux-arm64', 'darwin-x64', 'darwin-arm64', 'win-x64', 'win-arm64'];
          const expected = platforms.map(platform => `neon-${manifest.version}-${platform}.zip`).sort();
          assert.deepEqual((await readdir('release-assets')).sort(), expected);
          await copyFile('.tabularium', 'release-assets/default.tabularium');
          const checksums = [];
          for (const name of [...expected, 'default.tabularium']) {
            const bytes = await readFile(`release-assets/${name}`);
            checksums.push(`${createHash('sha256').update(bytes).digest('hex')}  ${name}`);
          }
          await writeFile('release-assets/SHA256SUMS', checksums.join('\n') + '\n');
          NODE
      - name: Publish all native packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/*.zip \
            release-assets/default.tabularium release-assets/SHA256SUMS \
            --verify-tag --title "Neon $GITHUB_REF_NAME" --generate-notes
